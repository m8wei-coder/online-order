<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      #grandparent {
        width: 300px;
        height: 300px;
        background-color: lightpink;
      }
      #parent {
        width: 200px;
        height: 200px;
        background-color: lightcoral;
      }
      #child {
        width: 100px;
        height: 100px;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    Hello World!

    <div id="user" class="common">
      Users:
      <ul class="box common">
        <li id="john">John</li>
        <li id="peter">Peter</li>
      </ul>
    </div>

    <h2>capturing vs bubbling</h2>
    <div id="grandparent">
      <div id="parent">
        <div id="child"></div>
      </div>
    </div>
  </body>
</html>

<script>
  const oUser = document.getElementById("user");
  const oCommon = document.getElementsByClassName("common");
  const oLis = document.getElementsByTagName("li");
  const boxCommon = document.getElementsByClassName("box common")[0];
  const peter = boxCommon.getElementsByTagName("li")[1];

  const oCommon2 = document.querySelectorAll(".common");

  // example of how to create a new element
  const newLi = document.createElement("li");
  newLi.innerText = "Xiao Hong";
  peter.after(newLi);
  // peter.before(newLi);

  const xiaozhang = document.createElement("li");
  xiaozhang.innerHTML = "<i>Xiao Zhang</i>";
  // boxCommon.append(xiaozhang);
  boxCommon.prepend(xiaozhang);

  // edit class or css example
  xiaozhang.className = "Xiao Zhang class2";
  xiaozhang.classList.add("class3");
  xiaozhang.classList.remove("class2");
  xiaozhang.style.color = "red";

  // capturing vs bubbling
  const child = document.getElementById("child");
  const parent = document.getElementById("parent");
  const grandparent = document.getElementById("grandparent");

  child.addEventListener(
    "click",
    (e) => {
      // e.stopPropagation();
      console.log("child");
    },
    false
  );

  parent.addEventListener(
    "click",
    () => {
      console.log("parent");
    },
    false
  );

  grandparent.addEventListener(
    "click",
    () => {
      console.log("grandparent");
    },
    false
  );
</script>
