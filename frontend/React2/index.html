<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/react@^16/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@16.13.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>
  </head>
  <body>
    hello world

    <div id="root"></div>
  </body>
</html>

<script type="text/babel">
  // browser DOM
  const ele1 = document.createElement("h1");
  ele1.innerText = "hello world (real/browser DOM)";
  document.getElementById("root").append(ele1);

  // virtual DOM
  const ele2 = React.createElement("h1", null, "hello world (virtual DOM)");

  // JSX
  const MY_VARIABLE = "VDOM";
  const ele3 = <h1>hello world (JSX, {MY_VARIABLE})</h1>;

  // functional component
  function Hello(props) {
    console.log("props", props);

    return (
      <div>
        <h1>Hello, {props.name}</h1>
        <HelloClassComponent nickName={"Alice"}/>
      </div>
    );
  }

  // class component
  class HelloClassComponent extends React.Component {
    constructor(props) {
      super(props);
      console.log("props in constructor", this.props);
    }

    render() {
      return (
        <div>
          <h1>Hello, {this.props.nickName}</h1>
        </div>
      );
    }
  }

  ReactDOM.render([ele2, ele3, <Hello name={"Charlie"} age={18} />],
   document.getElementById("root"));
</script>
