<!doctype html>
<html lang="en">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Document</title>


   <script src="https://unpkg.com/react@^16/umd/react.production.min.js"></script>
   <script src="https://unpkg.com/react-dom@16.13.0/umd/react-dom.production.min.js"></script>
   <script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>
 </head>
 <body>
   <div id="root"></div>
   <script type="text/babel">
        class Parent extends React.Component {
            constructor(props) {
                super(props);
                this.state = {
                    balance: 10,
                    words: "hello world",
                };

                this.regularMethod = this.regularMethod.bind(this);
            }

            regularMethod() {
                console.log("this", this);
                this.setState({
                    balance: 0,
                });
            }

            regularMethodWithoutBinding(amt) {
                this.setState({
                    balance: this.state.balance - amt,
                });
            }

            arrowMethod = () => {
                this.setState({
                    balance: this.state.balance + 10,
                });
            }

            render() {
                return (
                    <div>继承者们的故事
                        <div>Parent</div>
                        <div>Balance: {this.state.balance}</div>
                        <button onClick={this.regularMethod}>破产</button>
                        <button onClick={() => this.regularMethodWithoutBinding(10)}>亏本 -10</button>
                        <button onClick={this.regularMethodWithoutBinding.bind(this, 20)}>亏本 -20</button>
                        <button onClick={this.arrowMethod}>盈利 +10</button>
                        <button>报账</button>

                        <ChildA
                            balance={this.state.balance}
                            reset={this.regularMethod}
                        />
                        <ChildB balance={this.state.balance} />

                    </div>
                );
            }
        }

        class ChildA extends React.Component {
            render() {
                return (
                    <div>
                        ChildA 父母账户余额: {this.props.balance}
                        <button onClick={this.props.reset}>搞事情</button>
                    </div>
                );
            }
        }

        class ChildB extends React.Component {
            render() {
                return (
                    <div>
                        ChildB 父母账户余额: {this.props.balance}
                    </div>
                );
            }
        }

        ReactDOM.render(<Parent />, document.getElementById('root'));
   </script>
 </body>
</html>
