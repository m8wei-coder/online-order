<script>
    let example; // declaration (default value is undefined)
    example = 1; // assignment

    // scoping {}
    // block scope: let, const
    // function scope: let, const, var
    // global scope: let, const, var

    {
        const xConst = 1;
        let xLet = 1;
        var xVar = 1;
    }

    for(let i = 0; i < 1; i++) {
        const xConstLoop = 1;
        let xLetLoop = 1;
        var xVarLoop = 1;
    }

    function exampleFunction() {
        const xConstFunc = 1;
        let xLetFunc = 1;
        var xVarFunc = 1;
    }

    const arrorFunctionExample = () => {
        const xConstArrowFunc = 1;
        let xLetArrowFunc = 1;
        var xVarArrowFunc = 1;
    }

    // re-declaration
    var account_balance = 100;
    console.log("account_balance: " + account_balance);

    var account_balance = 0;
    console.log("account_balance: " + account_balance);


    let account_balance2 = 100;
    console.log("account_balance2: " + account_balance2);
    // let account_balance2 = 0; // SyntaxError
    console.log("account_balance2: " + account_balance2);

    // destucturing
    const array = [1, true, "string"];
    const [x, y, z] = array;
    console.log("x: " + x);
    console.log("y: " + y);
    console.log("z: " + z);

    const studentProfile = {
        name: "zhang",
        age: 18,
        motto: "never give up",
    };

    const name = "someone else";
    const { name: new_name, age, motto } = studentProfile;
    console.log("name: " + name);
    console.log("new_name: " + new_name);
    console.log("age: " + age);
    console.log("motto: " + motto);

    // rest operator ...
    function fn(first, second = "100", ...args) {
        console.log("first: ", first);
        console.log("second: ", second);
        console.log("args: ", args);
    }

    console.log("rest case 1");
    fn(1,2);
    console.log("rest case 2");
    fn(1,2,3);
    console.log("rest case 3");
    fn(1,2,3,4,5);

    // default value
    console.log("default value");
    fn(1);

    // spread operator ...
    const arr1 = [1, 2, 3];
    const arr2 = [4, 5, 6];
    const arr3 = [...arr1, ...arr2];
    console.log("arr3: ", arr3);

    const charlieStudent = {
        ...studentProfile,
        name: "charlie",
        gendar: "male",
    };
    console.log("charlieStudent: ", charlieStudent);

    // arror function
    const sum_2 = (num1, num2) => {
        return num1 + num2;
    };

    // one-line expression (ole)
    const sum_2_ole = (num1, num2) => num1 + num2;

    console.log("sum_2: ", sum_2(1, 2));
    console.log("sum_2_ole: ", sum_2_ole(1, 2));

    // class
    class Person {
        constructor(name, age = 18) {
            this.name = name;
            this.age = age;
        }

        methodA() {
            console.log("name:", this.name);
        }

        methodB() {
            console.log("age:", this.age);
        }
    }

    const person1 = new Person("ZhangSan");
    person1.methodA();
    person1.methodB();

    class Student extends Person {
        constructor(name, age, grade) {
            super(name, age);
            this.grade = grade;
        }

        methodC() {
            console.log("grade:", this.grade);
        }
    }

    // undefined age will trigger default value in Person constructor
    const xiaozhang = new Student("XiaoZhang", undefined, "A");
    xiaozhang.methodA();
    xiaozhang.methodB();
    xiaozhang.methodC();

    // template string
    const school = "USC";
    const diploma = `I graduated from ${school}.`;
    console.log(diploma);

</script>
